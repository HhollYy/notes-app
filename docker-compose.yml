services:
  web:
    build: .
    ports:
      - "5001:5000"
    environment:
      DATABASE_URL: postgresql+psycopg2://notes:notes@db:5432/notes
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notes
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes"]
      interval: 5s
      retries: 5

volumes:
  pgdata: